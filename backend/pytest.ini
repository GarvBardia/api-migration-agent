[pytest]
# tests/fixtures/ holds sample target-repo files, some of which are real,
# runnable pytest suites meant to execute INSIDE the Docker sandbox (Step 5)
# -- not to be collected by the host's own `pytest tests/` run. Without this,
# their test_*.py files get double-collected: once correctly, via the
# sandbox in test_validation.py, and once incorrectly, directly on the host
# (where e.g. the network-isolation fixture legitimately fails, since the
# host DOES have network access).
norecursedirs = fixtures
